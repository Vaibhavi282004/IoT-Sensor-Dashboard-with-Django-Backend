{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">📡 Sensor Data Dashboard</h2>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>Sensor</th>
            <th>Temperature (°C)</th>
            <th>Humidity (%)</th>
            <th>Timestamp</th>
        </tr>
    </thead>
    <tbody>
        {% for d in data %}
        <tr>
            <td>{{ d.sensor.name }}</td>
            <td>{{ d.temperature }}</td>
            <td>{{ d.humidity }}</td>
            <td>{{ d.timestamp }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="text-center">No data available</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
